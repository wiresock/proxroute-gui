# Generated by tools/export-gui-source.py. This workspace exists only so the two shared
# crates can inherit their package fields and dependency versions; it builds nothing on
# its own. Build the GUI from gui/ (its own workspace, pinned by gui/Cargo.lock).
[workspace]
resolver = "2"
members = ["crates/proxroute-ipc", "crates/proxroute-config"]
exclude = ["gui"]

[workspace.package]
authors = ["NT KERNEL"]
edition = "2021"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
ipnet = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
zeroize = "1"
