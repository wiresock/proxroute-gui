chip:
  log_filter:
    tip: "Filter the event log to this severity."
  conn_filter:
    tip: "Show only connections matching this decision or state."
  config_section:
    tip: "Switch to this part of the configuration."
  rule_target:
    tip: "Route traffic matched by this rule through this proxy or chain."
  rule_enabled:
    tip: "Enable or disable this rule. A disabled rule is skipped during matching."
  chain_add_hop:
    tip: "Add this proxy as a hop in the chain."

# Proxy-kind chip tooltips.
proxy:
  kind:
    socks5: "SOCKS5 — carries TCP and UDP. SOCKS5 / SOCKS5 TLS are the only kinds that proxy UDP (QUIC)."
    socks5_tls: "SOCKS5 with its control channel in a TLS tunnel to the proxy (trust the cert, or enable skip-verify). Carries TCP + UDP — but relayed UDP datagrams stay plain; TLS covers the control channel, not the UDP relay."
    socks4: "SOCKS4 — TCP only. Sends a username (USERID); the password is ignored."
    socks4a: "SOCKS4a — like SOCKS4, but the proxy resolves the destination hostname. TCP only."
    http: "HTTP CONNECT proxy — TCP only. Supports basic / digest / negotiate auth."
    https: "HTTP CONNECT over a TLS connection to the proxy — TCP only. The proxy's TLS cert must be trusted (or enable skip cert verification)."
  checking: "checking…"
  dns:
    remote: "The proxy resolves the destination hostname (DNS at the exit) — avoids leaking lookups locally."
    local: "Resolve the hostname locally, then hand the proxy an IP. Modeled but not enforced yet — the profile's DNS mode governs resolution."

# Chain chip tooltips.
chain:
  dns:
    first_hop: "Resolve the destination name at the chain ENTRY (locally, via the direct resolver) and send an IP through the chain — for split-horizon / corp DNS that only resolves on the client side. The resolved IP must be reachable from the exit hop's network."
    last_hop: "Hand the destination name to the EXIT hop, which resolves it remotely (leak-safe; resolves in the exit's network). The default."
    per_rule: "Defer to the per-rule / profile DNS. Not yet distinctly enforced — currently behaves like lastHop (resolves at the exit)."
  mode:
    static: "Chain through every hop in order (proxy → proxy → destination)."
    failover: "Treat the hops as alternatives (not a chain): each flow uses ONE hop, trying them in order until one connects. Hops that a health check reports as down are tried last, not skipped."
    round_robin: "Treat the hops as alternatives (not a chain): spread flows across them in rotation. Hops that a health check reports as down are tried last, not skipped."
    latency: "Treat the hops as alternatives (not a chain): each flow prefers the lowest-RTT hop. Hops that a health check reports as down are tried last; set a healthCheck on each hop so they can be ranked (unranked hops fall back to config order)."

# Rule action chip tooltips.
action:
  proxy: "Route matching flows through a single proxy."
  chain: "Route matching flows through a proxy chain (multiple hops in order)."
  direct: "Connect directly, bypassing all proxies."
  block: "Drop matching flows (fail closed)."

# On-failure chip tooltips.
on_failure:
  block: "If the proxy/chain is unreachable, block the flow (fail closed)."
  direct: "If the proxy/chain is unreachable, fall back to a direct connection."
  next: "If the proxy/chain is unreachable, fall through to the next matching rule."

