proxy:
  kind:
    socks5: "SOCKS5 — передаёт TCP и UDP. SOCKS5 / SOCKS5 TLS — единственные виды, проксирующие UDP (QUIC)."
    socks5_tls: "SOCKS5 с управляющим каналом в TLS-туннеле к прокси (доверяйте сертификату или включите пропуск проверки). Передаёт TCP + UDP, но ретранслируемые UDP-датаграммы остаются незашифрованными; TLS защищает управляющий канал, а не UDP-ретрансляцию."
    socks4: "SOCKS4 — только TCP. Отправляет имя пользователя (USERID); пароль игнорируется."
    socks4a: "SOCKS4a — как SOCKS4, но прокси сам разрешает имя узла назначения. Только TCP."
    http: "HTTP CONNECT прокси — только TCP. Поддерживает аутентификацию basic / digest / negotiate."
    https: "HTTP CONNECT поверх TLS-соединения с прокси — только TCP. Сертификат TLS прокси должен быть доверенным (или включите пропуск проверки сертификата)."
  checking: "проверяю…"
  dns:
    remote: "Прокси разрешает имя узла назначения (DNS на стороне выхода) — не раскрывает запросы локально."
    local: "Разрешать имя локально, затем передавать прокси IP-адрес. Смоделировано, но пока не применяется — разрешение определяется режимом DNS профиля."

chain:
  dns:
    first_hop: "Разрешать имя назначения на ВХОДЕ цепочки (локально, через прямой резолвер) и отправлять IP через цепочку — для split-horizon / корпоративного DNS, который разрешается только на стороне клиента. Полученный IP должен быть достижим из сети выходного узла."
    last_hop: "Передавать имя назначения ВЫХОДНОМУ узлу, который разрешает его удалённо (без утечек; разрешение в сети выхода). По умолчанию."
    per_rule: "Определяется правилом / профилем. Пока не применяется отдельно — ведёт себя как lastHop (разрешение на выходе)."
  mode:
    static: "Проходить через каждый узел по порядку (прокси → прокси → назначение)."
    failover: "Рассматривать узлы как альтернативы (не цепочку): каждый поток использует ОДИН узел, перебирая их по порядку до первого подключения. Узлы, отмеченные проверкой доступности как недоступные, пробуются последними, а не пропускаются."
    round_robin: "Рассматривать узлы как альтернативы (не цепочку): распределять потоки между ними по очереди. Узлы, отмеченные проверкой доступности как недоступные, пробуются последними, а не пропускаются."
    latency: "Рассматривать узлы как альтернативы (не цепочку): каждый поток предпочитает узел с наименьшим RTT. Узлы, отмеченные проверкой доступности как недоступные, пробуются последними; задайте healthCheck на каждом узле, чтобы их можно было ранжировать (неранжированные узлы используют порядок из конфигурации)."

action:
  proxy: "Направлять подходящие потоки через один прокси."
  chain: "Направлять подходящие потоки через цепочку прокси (несколько узлов по порядку)."
