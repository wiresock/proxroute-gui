chip:
  log_filter:
    tip: "Filtra el registro de eventos a esta severidad."
  conn_filter:
    tip: "Muestra solo las conexiones que coinciden con esta decisión o estado."
  config_section:
    tip: "Cambia a esta parte de la configuración."
  rule_target:
    tip: "Enruta el tráfico que coincide con esta regla a través de este proxy o cadena."
  rule_enabled:
    tip: "Activa o desactiva esta regla. Una regla desactivada se omite durante la coincidencia."
  chain_add_hop:
    tip: "Añade este proxy como salto de la cadena."

# Proxy-kind chip tooltips.
proxy:
  kind:
    socks5: "SOCKS5 — transporta TCP y UDP. SOCKS5 / SOCKS5 TLS son los únicos tipos que proxifican UDP (QUIC)."
    socks5_tls: "SOCKS5 con su canal de control dentro de un túnel TLS hacia el proxy (confía en el certificado o activa omitir la verificación). Transporta TCP + UDP — pero los datagramas UDP retransmitidos van sin cifrar; TLS cubre el canal de control, no la retransmisión UDP."
    socks4: "SOCKS4 — solo TCP. Envía un nombre de usuario (USERID); la contraseña se ignora."
    socks4a: "SOCKS4a — como SOCKS4, pero el proxy resuelve el nombre de host del destino. Solo TCP."
    http: "Proxy HTTP CONNECT — solo TCP. Admite autenticación basic / digest / negotiate."
    https: "HTTP CONNECT sobre una conexión TLS hacia el proxy — solo TCP. El certificado TLS del proxy debe ser de confianza (o activa omitir la verificación del certificado)."
  checking: "comprobando…"
  dns:
    remote: "El proxy resuelve el nombre de host del destino (DNS en la salida) — evita filtrar consultas localmente."
    local: "Resuelve el nombre de host localmente y entrega al proxy una IP. Modelado pero aún no aplicado — el modo DNS del perfil gobierna la resolución."

# Chain chip tooltips.
chain:
  dns:
    first_hop: "Resuelve el nombre de destino en la ENTRADA de la cadena (localmente, mediante el resolutor directo) y envía una IP a través de la cadena — para DNS corporativo / split-horizon que solo resuelve en el lado del cliente. La IP resuelta debe ser alcanzable desde la red del salto de salida."
    last_hop: "Entrega el nombre de destino al salto de SALIDA, que lo resuelve remotamente (sin fugas; resuelve en la red de la salida). El valor por defecto."
    per_rule: "Delega en el DNS por regla / del perfil. Aún no se aplica de forma diferenciada — actualmente se comporta como lastHop (resuelve en la salida)."
  mode:
    static: "Encadena a través de todos los saltos en orden (proxy → proxy → destino)."
    failover: "Trata los saltos como alternativas (no una cadena): cada flujo usa UN salto, probándolos en orden hasta que uno conecte. Los saltos que una comprobación de estado reporta caídos se prueban al final, no se omiten."
    round_robin: "Trata los saltos como alternativas (no una cadena): reparte los flujos entre ellos en rotación. Los saltos que una comprobación de estado reporta caídos se prueban al final, no se omiten."
    latency: "Trata los saltos como alternativas (no una cadena): cada flujo prefiere el salto con menor RTT. Los saltos que una comprobación de estado reporta caídos se prueban al final; configura un healthCheck en cada salto para poder clasificarlos (los saltos sin clasificar usan el orden de la configuración)."

# Rule action chip tooltips.
action:
  proxy: "Enruta los flujos coincidentes a través de un único proxy."
  chain: "Enruta los flujos coincidentes a través de una cadena de proxies (varios saltos en orden)."
  direct: "Conecta directamente, sin pasar por ningún proxy."
  block: "Descarta los flujos coincidentes (bloqueo seguro)."

# On-failure chip tooltips.
on_failure:
  block: "Si el proxy/cadena no está disponible, bloquea el flujo (bloqueo seguro)."
  direct: "Si el proxy/cadena no está disponible, recurre a una conexión directa."
  next: "Si el proxy/cadena no está disponible, pasa a la siguiente regla coincidente."

